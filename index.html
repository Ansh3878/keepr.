<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://js.clerk.com" crossorigin />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="icon" href="favicon.ico" />
  <title>Keepr</title>
  <style>
    /* Loading screen styles - inline for instant display */
    #app-loader {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    #app-loader.loaded {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader-logo {
      width: 64px;
      height: 64px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .loader-lock {
      width: 32px;
      height: 32px;
      color: #000;
    }
    
    .loader-text {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    
    .loader-subtext {
      color: #71717a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 800;
    }
    
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #27272a;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 32px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }
  </style>
</head>

<body>
  <!-- Loading Screen -->
  <div id="app-loader">
    <div class="loader-logo">
      <svg class="loader-lock" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div class="loader-text">Keepr.</div>
    <div class="loader-subtext">Initializing Secure Environment</div>
    <div class="loader-spinner"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <script>
    // Remove loader once React mounts
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('loaded');
          setTimeout(() => loader.remove(), 500);
        }
      }, 100);
    });
  </script>
</body>

</html>
